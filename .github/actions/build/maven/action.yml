
name: Java setup

inputs:
  skip-tests:
    default: false
    required: false
    type: boolean

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven

    - name: Download dependencies
      shell: bash
      run: ./mvnw -B -q dependency:go-offline

    - name: Build and test
      shell: bash
      if: inputs.skip-tests != 'true'
      run: ./mvnw -B -q clean verify surefire-report:report -Djar.name=app 

    - name: Build without tests
      if: inputs.skip-tests == 'true'
      shell: bash
      run: ./mvnw -B -q clean package -DskipTests -Djar.name=app

    - name: Publish test results
      if: inputs.skip-tests != 'true' && (success() || failure())
      uses: dorny/test-reporter@v2
      with:
        name: JUnit Tests
        path: target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: false

    - name: Upload test results
      if: always() && inputs.skip-tests != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: target/reports/
        retention-days: 1
        if-no-files-found: warn

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: service-build
        path: target/*.jar
        retention-days: 1
        if-no-files-found: error
