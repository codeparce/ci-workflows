# .github/workflows/docker-build.yml
name: Docker publish 

inputs:
  account-name:
    required: true
    type: string
  access-token:
    required: true
    type: string
  target-branch:
    required: true
    type: string

runs:
  using: "composite"
  steps:
      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: docker.io # parametrizar
          username: ${{ inputs.account-name }}
          password: ${{ inputs.access-token }}

      - name: Checkout code
        shell: bash
        run: ./mvnw -B -q dependency:go-offline

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ github.event.repository.name }}:${{ inputs.target-branch }} #${{ inputs.target-branch }}

