  # .github/workflows/docker-build.yml
name: GitHub Summary

inputs:
  scaner-name:
    type: string
    required: true
  report-file:
    type: string
    required: true

runs:
  using: "composite"
  steps:
      - name: Add results to GitHub Summary
        shell: bash
        run: |
          {
            echo "## Trivy Scan: ${{ inputs.scaner-name}}"
            echo "<details><summary>Expand for details</summary>"
            echo ""
            if [[ -f ${{ inputs.report-file }} ]]; then
              echo '```text'
              cat ${{ inputs.report-file }}
              echo
              echo '```'
            else
              echo "No report file was generated."
            fi
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"