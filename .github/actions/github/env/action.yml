  # .github/workflows/docker-build.yml
name: Github Env  

inputs:
  env-file:
    type: string
    required: true


runs:
  using: "composite"
  steps:
    - name: Load environment variables
      shell: bash
      run: |
        envsubst < ${{inputs.env-file}} > ${{inputs.env-file}}
        cat ${{inputs.env-file}} >> "$GITHUB_ENV"

